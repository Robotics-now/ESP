<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Robotics Now - Join Us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #0d0d0d;
      color: #fff;
      padding: 50px;
    }
    img.logo {
      width: 150px;   /* adjust size as needed */
      margin-bottom: 20px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
    }
    .icons {
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .icons a {
      font-size: 3rem;
      color: #fff; /* monochrome white */
      transition: color 0.3s ease;
    }
    .icons a:hover {
      color: #999; /* subtle hover effect */
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <img src="Youtube.png" alt="Robotics Now Logo" class="logo">

  <!-- Heading & Text -->
  <h1>Welcome to Robotics Now</h1>
  <p>Sign in or sign up to follow our journey!</p>

  <!-- Icons -->
  <div class="icons">
    <a href="https://www.youtube.com/@YourChannel" target="_blank" aria-label="YouTube">
      <i class="fab fa-youtube"></i>
    </a>
    <a href="https://discord.gg/YourInvite" target="_blank" aria-label="Discord">
      <i class="fab fa-discord"></i>
    </a>
  </div>
</body>
</html>
